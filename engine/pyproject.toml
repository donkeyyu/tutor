[project]
name = "tutor-engine"
version = "0.1.0"
description = "Deterministic mastery engine for the tutor DSH plugin"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
